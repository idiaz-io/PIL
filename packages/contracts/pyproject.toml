[project]
name = "pil-contracts"
version = "0.1.0"
description = "The shapes every MERP message takes. Definitions only, no runtime."
requires-python = ">=3.12"

# Zero dependencies, deliberately — and this is stronger than CLAUDE.md's requirement
# of "zero dependencies on anything else in this repo".
#
# Two reasons for taking it all the way to zero, including third-party:
#
#   1. QUILL needs contracts and does not need adapters. Keeping this distribution
#      dependency-free makes "you can take contracts alone" a physical fact rather
#      than a promise.
#   2. I-9 requires byte-identical serialisation forever. Delegating that to a
#      third-party library means its next release can silently change our bytes and
#      invalidate every signature written before the change. The canonical serialiser
#      here is stdlib-only and pinned by tests.
#
# Do not add a dependency to this list without an ADR.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pil_contracts"]
