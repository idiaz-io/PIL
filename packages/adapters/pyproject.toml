[project]
name = "pil-adapters"
version = "0.1.0"
description = "Translate vendor payloads into contract shapes."
requires-python = ">=3.12"

# Separately versioned and released from contracts (§8 decision 6), so a consumer that
# needs only the shapes never pulls in the translators.
#
# The connect surface arrived (Phase 3, ADR-0015): pil_adapters.execution makes real
# outbound calls (Fleet's REST API today), which is why httpx is a dependency here and
# nowhere else -- pil-contracts stays dependency-free (ADR-0006). This is a client, not a
# server; ADR-0015 is where that distinction against I-1 is made explicit.
dependencies = [
    "pil-contracts>=0.1.0",
    "pil-capabilities>=0.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pil_adapters"]
