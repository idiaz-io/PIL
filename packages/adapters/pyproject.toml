[project]
name = "pil-adapters"
version = "0.1.0"
description = "Translate vendor payloads into contract shapes."
requires-python = ">=3.12"

# Separately versioned and released from contracts (§8 decision 6), so a consumer that
# needs only the shapes never pulls in the translators.
#
# Phase A is translate-only: no HTTP client appears here, because nothing in this
# package connects to anything. When the connect surface arrives it brings its own
# dependency and its own ADR.
dependencies = [
    "pil-contracts>=0.1.0",
    "pil-capabilities>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pil_adapters"]
