[project]
name = "pil-graph-writer"
version = "0.1.0"
description = "Project a translated Envelope onto ITKG graph operations. Construction only."
requires-python = ">=3.12"

# Starts at the Envelope boundary, after translation -- so this depends on pil-contracts
# for the shape and pil-graph for the operations/vocabulary, never on pil-adapters. A
# translator never needs to know this package exists; wiring it in is pil_adapters.sink's
# job (GraphSink), not this one's.
dependencies = [
    "pil-contracts>=0.1.0",
    "pil-graph>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pil_graph_writer"]
