[project]
name = "pil-gate"
version = "0.1.0"
description = "May this act run — allow / hold / deny over pil-capabilities. Library only; no ledger write."
requires-python = ">=3.12"

# Separately versioned (mirrors pil-graph / ADR-0011). Depends only on
# pil-capabilities — authorization is neither wire shape, vendor translation,
# nor graph access (ADR-0013 §1). The blast-radius *input* is a typed value
# the caller already computed; this package does not run the query.
dependencies = [
    "pil-capabilities>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pil_gate"]
