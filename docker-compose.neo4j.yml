# A throwaway Neo4j for local dev/test only -- PIL itself is never deployed (I-1) and
# this file deploys nothing; it exists so a developer's laptop can prove pil_graph
# against a real database the way tests/test_graph_neo4j_integration.py expects.
#
# neo4j:5 -- the identical image and version AXO's own CI already pins for its
# itkg-leak job (idiaz-io/Axo, merp-integration, .github/workflows), so both language
# ports of the ITKG design run against the same server, not merely "a Neo4j 5".
#
# make neo4j-up / make neo4j-down (see Makefile) wrap this. Manual equivalent:
#   docker compose -f docker-compose.neo4j.yml up -d
#   NEO4J_TEST_URI=bolt://localhost:7687 NEO4J_TEST_USER=neo4j \
#     NEO4J_TEST_PASSWORD=testpassword uv run pytest tests/test_graph_neo4j_integration.py
#   docker compose -f docker-compose.neo4j.yml down -v

services:
  neo4j:
    image: neo4j:5
    environment:
      # Matches NEO4J_TEST_USER/NEO4J_TEST_PASSWORD's defaults below and in AXO's own
      # itkg_integration_test.go -- point at the same running instance with either
      # side's test suite, no reconfiguration needed.
      NEO4J_AUTH: neo4j/testpassword
    ports:
      - "7687:7687" # bolt -- what the neo4j driver actually connects over
      - "7474:7474" # http -- browser UI, and what the healthcheck below polls
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
