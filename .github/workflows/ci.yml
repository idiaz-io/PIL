# NOTE: this file must stay at the repository root under .github/workflows/.
# AXO's workflows live at msp-platform/.github/workflows/ and healing-graph-core/.github/
# workflows/ — both too deep for GitHub to ever trigger, which is why AXO has had
# "CI" for months without a single run. Do not nest this one.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a translator that formats a timestamp in local time fails here rather
  # than on someone's laptop. Several of AXO's normalisers do exactly that.
  TZ: UTC

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12 --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  fresh-clone:
    name: README alone (DoD 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Definition of Done item 8: "A new engineer can clone the repo and run the full
      # test suite using only the README." These are the only two commands the README
      # tells them to run, executed with nothing else set up.
      - run: make install
      - run: make test

  parity:
    name: parity against AXO (DoD 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This step used to set a flag that every later step tested, so a missing secret
      # skipped the whole job and it reported success with a warning nobody reads. The
      # job that proves the migration must not be able to pass by not running: DoD item
      # 7 is read off this check mark. Missing configuration is now a failure.
      - name: Require AXO access
        run: |
          if [ -z "${{ secrets.AXO_READ_TOKEN }}" ]; then
            echo "::error title=Parity cannot run::AXO_READ_TOKEN is not configured, so the harness cannot check out AXO. This job fails rather than skipping, because a green parity check with nothing compared is worse than no check. Definition of Done item 7 is not satisfiable until this secret exists."
            exit 1
          fi
          if [ -z "${{ vars.AXO_PARITY_SHA }}" ]; then
            echo "::error title=Parity revision unpinned::AXO_PARITY_SHA is not set. Parity must run against a known AXO revision, or the specification moves underneath the comparison."
            exit 1
          fi

      # PIL never vendors a product (I-3). The harness points at a checkout placed
      # beside it; it does not contain one, and nothing under packages/ imports it.
      - name: Check out AXO at a pinned revision
        uses: actions/checkout@v4
        with:
          repository: idiaz-io/Axo
          ref: ${{ vars.AXO_PARITY_SHA }}
          token: ${{ secrets.AXO_READ_TOKEN }}
          path: .axo

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12 --frozen

      # AXO's normalisers run under AXO's own interpreter — they need pydantic, httpx,
      # fastapi and sqlalchemy, which PIL's venv deliberately lacks (I-3).
      - name: Install AXO's dependencies
        run: |
          python -m venv .axo/msp-platform/.venv
          .axo/msp-platform/.venv/bin/pip install -q -r .axo/msp-platform/requirements.txt

      # Byte-identical or it fails, and it cannot pass having compared nothing: an empty
      # corpus exits non-zero, and every source must meet --min-per-source. This job also
      # checks AXO against fixtures/_expected first — the committed specification — so an
      # unannounced change to AXO's normalisers fails here rather than silently redefining
      # what "correct" means.
      - name: Parity
        run: make parity AXO_PATH=.axo
